[package]
# Single package: every file below moves to the same version on each release.
# `crates/twofau-core` is not listed — it inherits `version.workspace = true`
# from the root `Cargo.toml`, so bumping that entry covers it. Knope errors if
# any listed file disagrees on the current version, so keep them all in sync.
versioned_files = [
    "package.json",
    "apps/twofau-app/package.json",
    "apps/twofau-extension/package.json",
    "apps/twofau-site/package.json",
    "packages/core-wasm/package.json",
    "packages/i18n/package.json",
    "packages/ui/package.json",
    "Cargo.toml",
    "apps/twofau-app/src-tauri/Cargo.toml",
    "crates/twofau-wasm/Cargo.toml",
    "Cargo.lock",
    { path = "apps/twofau-extension/manifest.json", regex = '"version": "(?<version>\d+\.\d+\.\d+)"' },
    { path = "apps/twofau-app/src-tauri/tauri.conf.json", regex = '"version": "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"

[github]
owner = "2fau"
repo = "2fau-app"

[[workflows]]
name = "prepare-release"
# The PR must come from a branch other than `base`: this workflow runs on a
# push to main, so without the switch/commit/push below Knope asks GitHub for a
# main -> main PR and gets 422 "No commits between main and main".
[[workflows.steps]]
type = "Command"
command = "git switch -c release"
[[workflows.steps]]
type = "PrepareRelease"
[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: Release $version\""
variables = { "$version" = "Version" }
# Force-push: the branch is disposable, rewritten on every push to main.
[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"
[[workflows.steps]]
type = "CreatePullRequest"
base = "main"
[workflows.steps.title]
template = "chore: Release {version}"
variables = { "{version}" = "Version" }
[workflows.steps.body]
template = "Automated release. Merging publishes:\n\n{changelog}"
variables = { "{changelog}" = "ChangelogEntry" }

[[workflows]]
name = "release"
[[workflows.steps]]
type = "Release"

[[workflows]]
name = "document-change"
[[workflows.steps]]
type = "CreateChangeFile"

# CI guard fact (knope 0.23.0): when there is nothing to release, both
# `prepare-release` and `release` exit 1 with error code `releases::no_release`
# ("No packages are ready to release"). The workflows grep stdout for
# `no_release` to treat that as a green no-op.
