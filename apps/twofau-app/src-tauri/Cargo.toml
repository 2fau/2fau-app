[package]
name = "twofau-app"
version = "0.1.0"
description = "2FAu — menu-bar TOTP/HOTP authenticator"
authors = ["Nikolay Kostyurin"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows
# cargo quirk: https://github.com/rust-lang/cargo/issues/8519).
name = "twofau_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
twofau-core = { path = "../../../crates/twofau-core" }
keyring = "3"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# Outbound HTTPS for the time sync. Default features bring rustls TLS (no system
# OpenSSL, so the CI cross-builds stay clean); `json` adds `into_json`. Also
# used by the bridge integration tests (plain http on loopback).
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
twofau-core = { path = "../../../crates/twofau-core" }
base64 = "0.22"

# NOTE: build profiles live in the workspace root Cargo.toml (this crate is a
# workspace member, so a [profile] here would be ignored).
