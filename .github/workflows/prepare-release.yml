name: Prepare release

# Knope keeps a "chore: Release x.y.z" pull request up to date with the next
# version + changelog, computed from Conventional Commits (and any change files
# in .changeset/). Merge that PR to cut a release — see release.yml's
# `knope-release` job, which tags and creates the GitHub Release on merge.
#
# Requires a RELEASE_TOKEN secret: a PAT with Contents + Pull requests
# read/write. The org disables write for the default GITHUB_TOKEN, and a
# GITHUB_TOKEN-created tag wouldn't trigger release.yml anyway. When the secret
# is absent the job skips with a warning instead of failing red.
on:
  push:
    branches: [main]

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    # Skip the release PR's own bump commit so we don't loop preparing a release
    # of the release.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: Release') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Require RELEASE_TOKEN
        id: gate
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning title=RELEASE_TOKEN missing::Skipping release preparation. Add a PAT (Contents + Pull requests: read/write) as the RELEASE_TOKEN secret to enable Knope releases."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.gate.outputs.ok == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.gate.outputs.ok == 'true'
        with:
          version: 0.23.0
      - name: Prepare release PR
        if: steps.gate.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set +e
          OUT="$(knope prepare-release --verbose 2>&1)"; CODE=$?
          printf '%s\n' "$OUT"
          if [ "$CODE" -ne 0 ]; then
            # `releases::no_release` means there was nothing to release — a green
            # no-op. Any other failure is real.
            printf '%s' "$OUT" | grep -qi 'no_release' && exit 0
            exit "$CODE"
          fi
