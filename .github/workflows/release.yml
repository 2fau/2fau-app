name: Release

# Builds native installers on each OS (the reliable path — cross-building a
# Windows NSIS installer from macOS is unsupported/flaky).
#
#   - push to main / manual dispatch -> "Continuous Release" prerelease (tag: tip)
#   - v* tag                          -> draft GitHub Release for that version
#
# Release steps authenticate with `secrets.RELEASE_TOKEN` when set, else the
# default GITHUB_TOKEN. This org disables write for GITHUB_TOKEN, so publishing
# requires a RELEASE_TOKEN secret (a fine-grained PAT with Contents: read/write
# on this repo) — otherwise release creation fails "Resource not accessible".
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Only one release run per ref at a time: rapid pushes otherwise spawn runs that
# each delete + recreate the `tip` release and fight over its assets. Newer wins.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the jobs that touch releases elevate to write.
permissions:
  contents: read

jobs:
  # Create the versioned tag + GitHub Release (with changelog) once the
  # "chore: Release" PR from prepare-release.yml is merged. Idempotent: on an
  # ordinary push the version equals the latest tag and `knope release` is a
  # green no-op (`releases::no_release`). Uses RELEASE_TOKEN so the tag it
  # creates triggers this same workflow's tag path (the bundle job) to attach
  # assets. Runs only on branch pushes, never on the tag it produces.
  knope-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require RELEASE_TOKEN
        id: gate
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning title=RELEASE_TOKEN missing::Skipping knope release. Add a PAT (Contents: read/write) as the RELEASE_TOKEN secret so the tag it creates can trigger the asset build."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.gate.outputs.ok == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.gate.outputs.ok == 'true'
        with:
          version: 0.23.0
      - name: Create release + tag
        if: steps.gate.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set +e
          OUT="$(knope release --verbose 2>&1)"; CODE=$?
          printf '%s\n' "$OUT"
          if [ "$CODE" -ne 0 ]; then
            printf '%s' "$OUT" | grep -qi 'no_release' && exit 0
            exit "$CODE"
          fi

  # For the rolling continuous build, drop the previous release + tip tag so it
  # re-cuts at the current commit. Skipped for versioned (v*) releases.
  reset-tip:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete previous continuous release and tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: gh release delete tip --repo "$REPO" --cleanup-tag --yes || true

  bundle:
    needs: [reset-tip]
    # Run after reset-tip on the continuous path, or immediately for v* tags
    # (where reset-tip is skipped).
    if: always() && (needs.reset-tip.result == 'success' || needs.reset-tip.result == 'skipped')
    permissions:
      contents: write # create/upload the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: self-hosted # Apple Silicon (self-hosted macOS arm64)
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    # The self-hosted Apple-Silicon runner is best-effort: if that build fails,
    # don't fail the release — Linux, Windows, and the extension still ship.
    continue-on-error: ${{ matrix.platform == 'self-hosted' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./ -> target"

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Install Linux bundling deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # The frontend needs the ts-rs bindings (cargo test) and the WASM package.
      - run: cargo test -p twofau-core
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build:core-wasm

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          projectPath: apps/twofau-app
          # tip path: manage the rolling "tip" prerelease as before.
          # tag path: upload the installers to the release Knope already created
          # for this tag. releaseName/releaseBody are left empty so Knope's title
          # and changelog body are preserved (tauri-action only overwrites them
          # when set); releaseDraft:false matches Knope's published release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'tip' }}
          releaseName: ${{ github.ref_type == 'tag' && '' || 'Continuous Release' }}
          releaseBody: ${{ github.ref_type == 'tag' && '' || 'Automatically built from the latest commit on main. Unstable.' }}
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Package every browser deliverable in the Linux leg only, right after the
      # release exists. Doing it here (rather than a separate job that needs the
      # whole matrix) means it never waits on the other OS legs — an Intel-macOS
      # runner that never gets scheduled used to block the extension entirely.
      # The frontend prereqs (ts-rs bindings, WASM, node deps) are already set up
      # above, so `package` only has to build the extension and emit, into
      # apps/twofau-extension/artifacts/:
      #   2fau-chrome-<v>.crx    signed Chrome extension (CRXv3)
      #   2fau-chrome-<v>.zip    Chrome payload as a plain zip (Web Store upload)
      #   2fau-firefox-<v>.zip   Firefox payload as a plain zip (AMO upload)
      #   2fau-firefox-<v>.xpi   Firefox add-on file
      #
      # A stable crx signing key (repo secret CRX_PRIVATE_KEY, a PEM RSA private
      # key) keeps the extension ID constant across releases; crx3 reuses the
      # key.pem written here. Without the secret crx3 mints a throwaway key so the
      # build still succeeds — but the ID then changes every run, which breaks
      # updates and pinning.
      #
      # Caveat: a self-signed .crx cannot be drag-installed into stable Chrome
      # ("CRX_REQUIRED_PROOF_MISSING"); it's for enterprise policy / self-hosted
      # update manifests. For normal installs use the .zip (load unpacked or
      # upload to the Web Store) or the AMO-signed .xpi produced below.
      - name: Package the browser extensions (crx, xpi, zips)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            printf '%s' "$CRX_PRIVATE_KEY" > apps/twofau-extension/key.pem
          else
            echo "::warning::CRX_PRIVATE_KEY secret is not set — a throwaway signing key will be generated; the extension ID will not be stable across releases."
          fi
          pnpm --filter @twofau/extension package
          rm -f apps/twofau-extension/key.pem

      - name: Attach the extensions to the release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          # tag push -> that version's release; otherwise the rolling "tip".
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'tip' }}
        run: |
          gh release upload "$TAG" \
            apps/twofau-extension/artifacts/*.crx \
            apps/twofau-extension/artifacts/*.zip \
            apps/twofau-extension/artifacts/*.xpi \
            --repo "$REPO" --clobber

      # Submit a LISTED version to AMO (addons.mozilla.org) so the add-on ships
      # from the Firefox store. Tag releases only — never the rolling `tip`
      # continuous build (that would flood store review). Runs when the AMO API
      # credentials are set as repo secrets (addons.mozilla.org -> Manage API
      # Keys -> create JWT issuer/secret).
      #
      # One-time manual prerequisites:
      #  - The listed add-on "firefox@2fau.app" (GECKO_ID in firefox-manifest.mjs)
      #    must exist on AMO with its listing metadata filled in (name, summary,
      #    categories, privacy policy, screenshots). A brand-new listed add-on's
      #    first version is created here on upload, but the listing details must be
      #    completed in the AMO Developer Hub before it goes public.
      #  - Because the popup/background bundles are minified, Mozilla requires the
      #    human-readable source: we upload a git archive of the tagged commit.
      #    Reviewers follow apps/twofau-extension/REVIEWERS.md to reproduce it.
      #
      # --approval-timeout 0 uploads and returns immediately rather than blocking
      # CI while a human reviews the listed submission (which can take days). No
      # signed .xpi comes back for a listed submission — users install from the
      # store — so nothing is attached to the GitHub release here; the unsigned
      # .zip/.xpi from the packaging step above remain attached for reference.
      - name: Check for AMO credentials
        if: matrix.platform == 'ubuntu-22.04' && github.ref_type == 'tag'
        id: amo
        run: echo "have=${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}" >> "$GITHUB_OUTPUT"

      - name: Submit the Firefox add-on to AMO (listed)
        if: matrix.platform == 'ubuntu-22.04' && github.ref_type == 'tag' && steps.amo.outputs.have == 'true'
        env:
          AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # Human-readable source for review: all tracked files at this tag.
          git archive --format=zip -o "$GITHUB_WORKSPACE/twofau-source.zip" HEAD
          pnpm --filter @twofau/extension exec web-ext sign \
            --source-dir dist-firefox \
            --channel listed \
            --api-key "$AMO_ISSUER" \
            --api-secret "$AMO_SECRET" \
            --upload-source-code "$GITHUB_WORKSPACE/twofau-source.zip" \
            --approval-timeout 0
