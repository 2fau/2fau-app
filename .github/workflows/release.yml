name: Release

# Builds native installers on each OS (the reliable path — cross-building a
# Windows NSIS installer from macOS is unsupported/flaky).
#
#   - push to main / manual dispatch -> "Continuous Release" prerelease (tag: tip)
#   - v* tag                          -> draft GitHub Release for that version
#
# Release steps authenticate with `secrets.RELEASE_TOKEN` when set, else the
# default GITHUB_TOKEN. This org disables write for GITHUB_TOKEN, so publishing
# requires a RELEASE_TOKEN secret (a fine-grained PAT with Contents: read/write
# on this repo) — otherwise release creation fails "Resource not accessible".
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Only one release run per ref at a time: rapid pushes otherwise spawn runs that
# each delete + recreate the `tip` release and fight over its assets. Newer wins.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the jobs that touch releases elevate to write.
permissions:
  contents: read

jobs:
  # For the rolling continuous build, drop the previous release + tip tag so it
  # re-cuts at the current commit. Skipped for versioned (v*) releases.
  reset-tip:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete previous continuous release and tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: gh release delete tip --repo "$REPO" --cleanup-tag --yes || true

  bundle:
    needs: [reset-tip]
    # Run after reset-tip on the continuous path, or immediately for v* tags
    # (where reset-tip is skipped).
    if: always() && (needs.reset-tip.result == 'success' || needs.reset-tip.result == 'skipped')
    permissions:
      contents: write # create/upload the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: self-hosted # Apple Silicon (self-hosted macOS arm64)
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    # The self-hosted Apple-Silicon runner is best-effort: if that build fails,
    # don't fail the release — Linux, Windows, and the extension still ship.
    continue-on-error: ${{ matrix.platform == 'self-hosted' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./ -> target"

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Install Linux bundling deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # The frontend needs the ts-rs bindings (cargo test) and the WASM package.
      - run: cargo test -p twofau-core
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build:core-wasm

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          projectPath: apps/twofau-app
          # tag push -> versioned draft; otherwise the rolling "tip" prerelease.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'tip' }}
          releaseName: ${{ github.ref_type == 'tag' && format('2FAU {0}', github.ref_name) || 'Continuous Release' }}
          releaseBody: ${{ github.ref_type == 'tag' && '' || 'Automatically built from the latest commit on main. Unstable.' }}
          releaseDraft: ${{ github.ref_type == 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Package every browser deliverable in the Linux leg only, right after the
      # release exists. Doing it here (rather than a separate job that needs the
      # whole matrix) means it never waits on the other OS legs — an Intel-macOS
      # runner that never gets scheduled used to block the extension entirely.
      # The frontend prereqs (ts-rs bindings, WASM, node deps) are already set up
      # above, so `package` only has to build the extension and emit, into
      # apps/twofau-extension/artifacts/:
      #   2fau-chrome-<v>.crx    signed Chrome extension (CRXv3)
      #   2fau-chrome-<v>.zip    Chrome payload as a plain zip (Web Store upload)
      #   2fau-firefox-<v>.zip   Firefox payload as a plain zip (AMO upload)
      #   2fau-firefox-<v>.xpi   Firefox add-on file
      #
      # A stable crx signing key (repo secret CRX_PRIVATE_KEY, a PEM RSA private
      # key) keeps the extension ID constant across releases; crx3 reuses the
      # key.pem written here. Without the secret crx3 mints a throwaway key so the
      # build still succeeds — but the ID then changes every run, which breaks
      # updates and pinning.
      #
      # Caveat: a self-signed .crx cannot be drag-installed into stable Chrome
      # ("CRX_REQUIRED_PROOF_MISSING"); it's for enterprise policy / self-hosted
      # update manifests. For normal installs use the .zip (load unpacked or
      # upload to the Web Store) or the AMO-signed .xpi produced below.
      - name: Package the browser extensions (crx, xpi, zips)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            printf '%s' "$CRX_PRIVATE_KEY" > apps/twofau-extension/key.pem
          else
            echo "::warning::CRX_PRIVATE_KEY secret is not set — a throwaway signing key will be generated; the extension ID will not be stable across releases."
          fi
          pnpm --filter @twofau/extension package
          rm -f apps/twofau-extension/key.pem

      - name: Attach the extensions to the release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          # tag push -> that version's release; otherwise the rolling "tip".
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'tip' }}
        run: |
          gh release upload "$TAG" \
            apps/twofau-extension/artifacts/*.crx \
            apps/twofau-extension/artifacts/*.zip \
            apps/twofau-extension/artifacts/*.xpi \
            --repo "$REPO" --clobber

      # Optional: produce an AMO-signed .xpi that installs in normal Firefox.
      # Runs only when the two AMO credentials are configured as repo secrets;
      # otherwise it's skipped and the unsigned .zip/.xpi above are the Firefox
      # assets (fine for AMO upload or a temporary about:debugging load).
      # Create the secrets from an AMO API key (addons.mozilla.org -> Manage API
      # Keys) and set the real add-on id via GECKO_ID in firefox-manifest.mjs.
      - name: Check for AMO credentials
        if: matrix.platform == 'ubuntu-22.04'
        id: amo
        run: echo "have=${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}" >> "$GITHUB_OUTPUT"

      - name: Sign the Firefox extension (AMO)
        if: matrix.platform == 'ubuntu-22.04' && steps.amo.outputs.have == 'true'
        env:
          AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm --filter @twofau/extension exec web-ext sign \
            --source-dir dist-firefox \
            --channel unlisted \
            --api-key "$AMO_ISSUER" \
            --api-secret "$AMO_SECRET" \
            --artifacts-dir "$GITHUB_WORKSPACE/amo"

      - name: Attach the signed Firefox add-on
        if: matrix.platform == 'ubuntu-22.04' && steps.amo.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'tip' }}
        run: |
          gh release upload "$TAG" "$GITHUB_WORKSPACE"/amo/*.xpi --repo "$REPO" --clobber
